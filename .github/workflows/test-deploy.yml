name: Test deployment

on:
  pull_request:
    branches:
      - master

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    # Read-only. A pull request from a fork gets a read-only token whatever this says, but one from a branch of this
    # repository would otherwise get the repository's default token, which can include write access, while running
    # the pull request's dependencies' install scripts.
    permissions:
      contents: read
    steps:
      # v7 runs on Node 24. `persist-credentials: false` keeps the token out of the workspace's git config, where
      # the install scripts that run next could read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is the active LTS line, matching the deploy. Node 20 reached end of life in April 2026.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test build website
        run: yarn build
