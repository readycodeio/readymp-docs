apiRules:
# Obsolete API stays public for source compatibility, but the reference leaves it out
- exclude:
    hasAttribute:
      uid: System.ObsoleteAttribute
# Wukong's console API takes it; Oblivion has no console API, so nothing here would use it
- exclude:
    uidRegex: ^ReadyM\.Api\.Command\.ConsoleCommand
# Serialize and Deserialize are how a type crosses the wire. Mods call them in their own payloads, so they stay in
# IntelliSense, but on every value type they would bury what the page is about
- exclude:
    uidRegex: '\.(Serialize|Deserialize)\((LiteNetLib\.Utils\.)?NetData(Writer|Reader)\)$'
# What the generators write beside a mod's own code, such as each event's handler set, is wired up by the SDK and
# never called by a mod
- exclude:
    uidRegex: '\.Generated(\.|$)'
